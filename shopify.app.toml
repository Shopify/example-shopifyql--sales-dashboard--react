# This file stores configuration for your Shopify app.
# `shopify app config link` populates client_id, application_url, and redirect_urls.
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration
client_id = ""

embedded = true

[access_scopes]
# [START campaign-dashboard.scopes]
# Granted at install. Changing this list re-prompts every user on next load.
scopes = "read_reports,write_reports,read_analytics_annotations,write_analytics_annotations"
# [END campaign-dashboard.scopes]

# [START campaign-dashboard.direct-api]
[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true
# [END campaign-dashboard.direct-api]

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.jsx
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"
